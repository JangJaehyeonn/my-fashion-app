name: Fix merge conflicts

# dev가 바뀌면 열려 있는 Claude PR 중 충돌난 것을 Claude(Opus)가 dev를 병합해 해결한다. 최대 3회, 넘으면 needs-human.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: 충돌난 Claude PR 찾기
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find_conflict.py >> "$GITHUB_OUTPUT"

  fix:
    needs: find
    if: needs.find.outputs.branch != ''
    concurrency:
      group: claude-fix-${{ needs.find.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find.outputs.branch }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline
          sparse-checkout: |
            .github/actions
            scripts
      - name: 시도 횟수 확인
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.find.outputs.pr }}
        run: python3 .pipeline/scripts/fix_attempt.py "$PR" conflict >> "$GITHUB_OUTPUT"
      - uses: ./.pipeline/.github/actions/setup-wearon
        if: steps.attempt.outputs.proceed == 'true'
      - name: 설치 액션 사본 정리 (커밋에 섞이지 않게)
        if: steps.attempt.outputs.proceed == 'true'
        run: rm -rf .pipeline
      - uses: anthropics/claude-code-action@v1
        if: steps.attempt.outputs.proceed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,github-actions"
          restrict_untrusted_prs: "false"
          prompt: |
            PR #${{ needs.find.outputs.pr }} (브랜치 ${{ needs.find.outputs.branch }})가 dev와 충돌합니다. CLAUDE.md의 규칙을 따르세요.
            1. `git fetch origin dev`와 `git merge origin/dev`로 병합하고 충돌을 해결하세요. 양쪽 변경의 의도를 모두 살리세요.
            2. rebase나 강제 푸시는 하지 마세요.
            3. `python3 scripts/check.py`를 통과시킨 뒤 `git push origin ${{ needs.find.outputs.branch }}`로 푸시하세요.
          claude_args: >-
            --max-turns 30
            --disallowedTools "Monitor"
            --model claude-opus-5-5
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3 scripts/check.py),Bash(python3 -m pytest:*),Bash(WEARON_ACTIVE_FRS=*),Bash(backend/gradlew -p backend:*),Bash(android/gradlew -p android:*),Bash(python3 -m pip install:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(which:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(touch:*),Bash(docker compose:*),Bash(docker ps:*),Bash(git fetch origin dev),Bash(git merge origin/dev:*),Bash(git push origin ${{ needs.find.outputs.branch }})"
      - name: 설치 액션 사본 복원 (post 단계용)
        if: always() && steps.attempt.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline
          sparse-checkout: |
            .github/actions
            scripts

name: AI review retry

# Claude PR의 AI 리뷰가 도구 문제로 결과 없이 끝났거나(ai-review: error) 아예 시작되지 않았으면 자동으로 다시 돌린다.
# - dev에 리뷰 워크플로·스크립트가 바뀌어 머지되면 바로, 그리고 30분마다 확인한다.
# - 같은 커밋에는 한 번만 다시 돌린다 (그래도 안 되면 사람에게: needs-human 유지).
# - 다시 돌릴 때 리뷰 오류로 붙은 needs-human 라벨을 떼어 자동 머지가 이어지게 한다.
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/ai-review.yml"
      - "scripts/ai_review_status.py"
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      checks: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MISSING_MINUTES: "30"
    steps:
      - name: 리뷰가 실패했거나 빠진 Claude PR 다시 리뷰
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("claude/")) | "\(.number) \(.headRefName) \(.headRefOid)"' |
          while read -r n branch sha; do
            review=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "ai-review")] | first | .state // ""')
            reason=""
            if [ "$review" = "error" ]; then
              reason="리뷰가 결과 없이 끝남"
            elif [ -z "$review" ]; then
              # CI 필수 잡이 모두 성공했는데 리뷰가 MISSING_MINUTES 넘게 시작되지 않은 경우
              checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "backend" or .name == "ai-server" or .name == "android" or .name == "acceptance")]')
              ok=$(printf '%s' "$checks" | jq '[.[] | select(.conclusion == "success")] | map(.name) | unique | length')
              done_at=$(printf '%s' "$checks" | jq -r '[.[].completed_at // empty] | max // ""')
              if [ "$ok" = "4" ] && [ -n "$done_at" ] && \
                 [ $(( (now - $(date -u -d "$done_at" +%s)) / 60 )) -ge "$MISSING_MINUTES" ]; then
                reason="CI 통과 후 리뷰가 시작되지 않음"
              fi
            fi
            [ -n "$reason" ] || continue
            marker="<!-- ai-review-retry:$sha -->"
            if gh api --paginate "repos/$REPO/issues/$n/comments?per_page=100" --jq '.[].body' | grep -qF "$marker"; then
              echo "PR #$n: 이미 한 번 다시 돌림 ($reason). 사람 확인 대기."
              continue
            fi
            echo "PR #$n: $reason → 다시 리뷰"
            gh pr edit "$n" --repo "$REPO" --remove-label needs-human || true
            gh pr comment "$n" --repo "$REPO" --body "$marker
          AI 리뷰를 자동으로 다시 실행합니다 ($reason, 커밋 ${sha:0:7})."
            gh workflow run ai-review.yml --repo "$REPO" --ref "${{ github.event.repository.default_branch }}" \
              -f branch="$branch" -f sha="$sha"
          done

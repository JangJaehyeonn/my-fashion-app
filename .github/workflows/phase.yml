name: Phase advance

# Phase 진행을 자동으로 넘긴다. 사람이 하는 일은 Phase마다 인수 테스트 PR 승인과 앱 화면 확인이다 (docs/phase-gate.md).
# 1) 인수 테스트(acceptance/phaseN)가 dev에 머지되면 → Phase N 이슈에 `ready`
# 2) Phase N 이슈가 모두 닫히면 → Phase N+1 이슈 생성 + 인수 테스트 초안 워크플로 실행
#    단 N+1이 저장소 변수 WEARON_MAX_AUTO_PHASE(기본 4)보다 크면 멈춘다 (Phase 5는 출시 후 사람이 시작).
on:
  push:
    branches: [dev]
    paths: ["acceptance/phase*/**"]
  issues:
    types: [closed]
  # 이슈 닫힘 직후에는 목록 조회가 늦게 반영돼 방금 닫힌 이슈가 열린 것으로 셀 수 있다.
  # 놓친 Phase 전환을 잡기 위해 매시간 다시 확인한다.
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: phase-advance
  cancel-in-progress: false

jobs:
  ready:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 인수 테스트가 머지된 Phase의 이슈를 ready로
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          phases=$(git diff --name-only "$BEFORE" "$AFTER" -- acceptance \
            | sed -nE 's#^acceptance/phase([0-9]+)/.*#\1#p' | sort -u)
          for p in $phases; do
            echo "Phase $p 이슈를 ready로 표시합니다."
            python3 scripts/create_issues.py --mark-ready "$p"
          done
          if [ -n "$phases" ]; then
            gh workflow run feeder.yml --ref "${{ github.event.repository.default_branch }}"
          fi

  next:
    if: >-
      github.event_name != 'push' && (
      github.event_name != 'issues' ||
      contains(join(github.event.issue.labels.*.name, ','), 'phase-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 끝난 Phase가 있으면 다음 Phase 시작
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOSED_ISSUE: ${{ github.event.issue.number || '' }}
          MAX_AUTO: ${{ vars.WEARON_MAX_AUTO_PHASE || '4' }}
        run: |
          set -euo pipefail
          # 목록 API(REST)로 센다. 방금 닫힌 이슈는 아직 열린 것으로 보일 수 있어 제외한다.
          open_count() {
            gh api --paginate "repos/$REPO/issues?state=open&labels=phase-$1&per_page=100" \
              --jq ".[] | select(.pull_request | not) | select(.number != ${CLOSED_ISSUE:-0}) | .number" | wc -l
          }
          any_count() {
            gh api "repos/$REPO/issues?state=all&labels=phase-$1&per_page=1" --jq '[.[] | select(.pull_request | not)] | length'
          }
          for phase in $(seq 1 $((MAX_AUTO - 1))); do
            [ "$(any_count "$phase")" != "0" ] || continue
            if [ "$(open_count "$phase")" != "0" ]; then
              echo "Phase $phase 진행 중"
              continue
            fi
            next=$((phase + 1))
            if [ "$(any_count "$next")" != "0" ]; then
              continue
            fi
            echo "Phase $phase 완료 → Phase $next 시작"
            python3 scripts/create_issues.py --phase "$next"
            gh workflow run acceptance-tests.yml --ref "${{ github.event.repository.default_branch }}" -f phase="$next"
            break
          done

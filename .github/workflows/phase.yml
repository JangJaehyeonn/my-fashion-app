name: Phase advance

# Phase 진행을 자동으로 넘긴다. 사람이 하는 일은 Phase마다 인수 테스트 PR 승인과 앱 화면 확인이다 (docs/phase-gate.md).
# 1) 인수 테스트(acceptance/phaseN)가 dev에 머지되면 → Phase N 이슈에 `ready`
# 2) Phase N 이슈가 모두 닫히면 → Phase N+1 이슈 생성 + 인수 테스트 초안 워크플로 실행
#    단 N+1이 저장소 변수 WEARON_MAX_AUTO_PHASE(기본 4)보다 크면 멈춘다 (Phase 5는 출시 후 사람이 시작).
on:
  push:
    branches: [dev]
    paths: ["acceptance/phase*/**"]
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: phase-advance
  cancel-in-progress: false

jobs:
  ready:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 인수 테스트가 머지된 Phase의 이슈를 ready로
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          phases=$(git diff --name-only "$BEFORE" "$AFTER" -- acceptance \
            | sed -nE 's#^acceptance/phase([0-9]+)/.*#\1#p' | sort -u)
          for p in $phases; do
            echo "Phase $p 이슈를 ready로 표시합니다."
            python3 scripts/create_issues.py --mark-ready "$p"
          done
          if [ -n "$phases" ]; then
            gh workflow run feeder.yml --ref "${{ github.event.repository.default_branch }}"
          fi

  next:
    if: >-
      github.event_name == 'issues' &&
      contains(join(github.event.issue.labels.*.name, ','), 'phase-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Phase가 끝났으면 다음 Phase 시작
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          MAX_AUTO: ${{ vars.WEARON_MAX_AUTO_PHASE || '4' }}
          OWNER: "@JangJaehyeonn"
        run: |
          set -euo pipefail
          phase=$(printf '%s' "$LABELS" | tr ',' '\n' | sed -nE 's/^phase-([0-9]+)$/\1/p' | head -n1)
          [ -n "$phase" ] || exit 0
          open=$(gh issue list --label "phase-$phase" --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "Phase $phase 남은 이슈: $open"
            exit 0
          fi
          next=$((phase + 1))
          if [ "$next" -gt "$MAX_AUTO" ]; then
            echo "Phase $next는 자동 시작 범위(WEARON_MAX_AUTO_PHASE=$MAX_AUTO) 밖입니다. 멈춥니다."
            exit 0
          fi
          existing=$(gh issue list --label "phase-$next" --state all --json number --jq length)
          if [ "$existing" != "0" ]; then
            echo "Phase $next 이슈가 이미 있습니다. 중복 실행을 막기 위해 멈춥니다."
            exit 0
          fi
          python3 scripts/create_issues.py --phase "$next"
          gh workflow run acceptance-tests.yml --ref "${{ github.event.repository.default_branch }}" -f phase="$next"
          echo "Phase $next 이슈를 만들고 인수 테스트 초안 작업을 시작했습니다."

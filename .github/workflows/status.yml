name: Status board

# 진행 현황판 이슈(status-board 라벨)를 갱신한다.
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: status-board
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      !contains(join(github.event.issue.labels.*.name, ','), 'status-board')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            docs/requirements
      - name: 현황판 갱신 (노션 연동이 설정돼 있으면 노션에도)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: python3 scripts/status_board.py --notion

name: Status board

# 진행 현황판 이슈(status-board 라벨)와 노션 페이지를 갱신한다.
# 워크플로 토큰이 만든 이벤트(라벨·코멘트)는 issues/pull_request 트리거를 깨우지 않고 예약 실행은 자주 빠진다.
# 그래서 파이프라인 워크플로가 시작·끝날 때마다(workflow_run) 갱신한다.
on:
  workflow_run:
    workflows:
      - Issue feeder
      - Claude
      - CI
      - AI review
      - Fix AI review
      - Fix failing CI
      - Fix merge conflicts
      - Acceptance tests draft
      - Phase advance
    types: [requested, completed]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: status-board
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      !contains(join(github.event.issue.labels.*.name, ','), 'status-board')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            docs/requirements
      - name: 현황판 갱신 (노션 연동이 설정돼 있으면 노션에도)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: python3 scripts/status_board.py --notion

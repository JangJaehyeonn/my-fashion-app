name: Deploy to EC2

# [비활성화 — 2026-11] AWS(EC2·IAM·S3)를 전부 정리해서 이 배포 대상 서버가 더 이상 없다.
# 그대로 두면 dev에 push할 때마다 접속할 수 없는 서버로 SSH를 시도하다 실패한다.
# 그래서 push 트리거를 없애고 수동 실행(workflow_dispatch)만 남겼다. 삭제하지 않은 이유: Tencent 서버가
# 준비되면 host/secrets/경로만 바꿔 되살릴 것이기 때문. 복구 절차는 docs/DEPLOY_TODO.md 참고.
# (되살릴 때 `on:`에 push 트리거를 다시 넣을 것)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/my-fashion-app
            git pull origin dev
            docker compose -f docker-compose.prod.yml up -d --build
            # nginx.conf는 단일 파일 바인드 마운트라 git pull로 파일이 교체돼도 컨테이너가 옛 파일을 잡고 있음 → 재시작해 반영
            docker compose -f docker-compose.prod.yml restart nginx
            docker image prune -f

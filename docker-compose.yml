services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashionapp
      POSTGRES_USER: fashionapp
      POSTGRES_PASSWORD: fashionapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai-server:
    build: ./ai-server
    ports:
      - "8000:8000"
    env_file:
      - ./ai-server/.env
    depends_on:
      - postgres

volumes:
  postgres_data:

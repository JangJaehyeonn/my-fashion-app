events {
    worker_connections 1024;
}

http {
    upstream spring_boot {
        server spring-boot:8080;
    }

    # HTTP(80): Let's Encrypt 도메인 검증만 직접 응답하고 나머지는 HTTPS로 보낸다.
    # 308(영구 + 메서드 유지)이라 옛 앱 버전의 POST/PUT 요청도 리다이렉트 후 그대로 재전송된다 (301은 POST를 GET으로 바꿈)
    server {
        listen 80;
        server_name fashion-app-jh.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # HTTPS(443): TLS 종료 후 Spring Boot로 프록시
    server {
        listen 443 ssl;
        http2 on;
        server_name fashion-app-jh.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/fashion-app-jh.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fashion-app-jh.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 20M;

        # 가상 피팅은 HF Space 대기열 + 합성으로 1~2분 걸릴 수 있어 기본 60초 대신 길게 (앱 OkHttp 180초와 맞춤)
        location /api/vton {
            proxy_pass http://spring_boot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 60s;
        }

        location / {
            proxy_pass http://spring_boot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

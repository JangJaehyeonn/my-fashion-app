server:
  # nginx가 TLS를 종료하고 X-Forwarded-Proto/Host를 넘겨주므로, 이를 신뢰해야 OAuth2 redirect_uri({baseUrl})가
  # http가 아닌 https로 만들어진다 (설정이 없으면 HTTPS 뒤에서도 http://... redirect_uri가 생성되어 로그인 실패)
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fashionapp}
    username: ${DB_USERNAME:fashionapp}
    # 비밀값은 기본값 없이 환경 변수로만 받는다. 빠지면 RequiredSecretsValidator가 변수 이름을 알려 주며 기동을 중단한다.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 동시에 열어둘 수 있는 최대 커넥션 수.
      # t3.small(2 vCPU, RAM 2GB) 한 대에 postgres/redis/ai-server/nginx까지 같이 떠 있어
      # 메모리를 나눠 써야 하므로 너무 크게 잡지 않음. (공식 권장 공식: (core*2)+1 ≈ 5,
      # k6 부하 테스트 결과 피크 50 VU에서도 43.8 req/s 수준이라 10이면 충분히 여유 있음)
      maximum-pool-size: 10
      # 트래픽이 없을 때도 미리 대기시켜 둘 최소 커넥션 수.
      # 너무 낮으면 순간 요청 시 커넥션을 새로 맺느라 지연이 생기고,
      # 너무 높으면 유휴 상태에서도 postgres 쪽 메모리를 계속 점유하게 됨.
      minimum-idle: 5
      # 커넥션 풀에서 커넥션을 못 받았을 때 대기할 최대 시간(ms).
      # 이 시간을 넘기면 SQLTransientConnectionException 발생.
      connection-timeout: 30000
      # 커넥션이 아무 요청 없이 유휴 상태로 있을 수 있는 최대 시간(ms).
      # minimum-idle보다 커넥션이 많을 때, 이 시간이 지나면 초과분을 회수함.
      idle-timeout: 600000
      # 커넥션 하나가 살아있을 수 있는 최대 수명(ms).
      # 이 시간이 지나면 오래된 커넥션을 자동으로 폐기하고 새로 생성 —
      # DB나 중간 네트워크 장비가 너무 오래된 커넥션을 끊어버리는 문제를 예방.
      max-lifetime: 1800000
      # 애플리케이션 로그/모니터링에서 풀을 구분하기 위한 이름.
      pool-name: FashionAppHikariCP
  jpa:
    # 요청 내내 영속성 컨텍스트(와 DB 커넥션)를 열어두지 않음 — AI 서버를 기다리는 동안 커넥션이 묶이지 않게 하기 위함
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000      # 1시간
  refresh-token-expiry: 1209600000  # 14일

# 이미지 저장소. STORAGE_TYPE=local(기본) | s3 (AWS S3, Tencent COS 등 S3 호환 서비스)
storage:
  type: ${STORAGE_TYPE:local}
  max-bytes: 10485760   # 이미지 1장 최대 10MB (multipart 한도와 같게)
  local:
    # 프로젝트 밖 기본 경로. 바꾸려면 STORAGE_LOCAL_ROOT (레포 안 경로를 쓰면 .gitignore 처리 필수)
    root: ${STORAGE_LOCAL_ROOT:${user.home}/fashionapp-storage}
  s3:
    endpoint: ${S3_ENDPOINT:}      # 비우면 AWS 기본. COS 예: https://cos.<region>.myqcloud.com
    region: ${S3_REGION:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:false}

# 날씨: OpenWeatherMap을 백엔드가 직접 호출 (AI 서버 불필요). 키는 WEATHER_API_KEY
weather:
  api-key: ${WEATHER_API_KEY:}
  base-url: https://api.openweathermap.org/data/2.5/weather

app:
  # 클라이언트가 이미지를 가져갈 때 쓰는 이 서버의 공개 주소 (local 저장소의 이미지 URL에 사용)
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # 웹 브라우저에서 API를 호출할 수 있는 출처 (쉼표로 구분). 와일드카드(*) 금지 — 자격 증명 허용 상태라 위험
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai-server-url: ${AI_SERVER_URL:http://localhost:8000}
  # Spring → AI 서버(FastAPI) 호출 타임아웃. 초과 시 AI_SERVER_TIMEOUT(504) 응답
  ai-server:
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    # 옷 분류·진단·코디/쇼핑 추천·날씨 (평소 2~6초)
    read-timeout: ${AI_SERVER_READ_TIMEOUT:30s}
    # 가상 피팅은 HF Space 대기열 + 합성으로 1~2분. nginx(/api/vton 180s)·앱 OkHttp(180s)보다 짧게 잡아
    # 클라이언트가 끊기 전에 서버가 먼저 504로 응답하게 함
    vton-read-timeout: ${AI_SERVER_VTON_READ_TIMEOUT:170s}
  oauth2-redirect-base: ${OAUTH2_REDIRECT_BASE:fashionapp://app}
  auth:
    # OAuth 성공 딥링크에 싣는 1회용 코드의 유효 시간 (POST /api/auth/exchange로 토큰 교환)
    exchange-code-ttl: 60s
    # 아이디·비밀번호 로그인: 같은 아이디로 연속 5회 실패하면 5분 잠금 (LoginAttemptLimiter)
    login-max-failures: 5
    login-lock-duration: 5m

wearon:
  backfill:
    # FR-08: true면 기동 때 새 속성(fit·material·pattern·season)이 비어 있는 옷의 사진을 다시 분류한다 (옷마다 분류 API 1회).
    # 기본값 false. 임베딩이 비어 있는 옷을 채우는 백필은 이 설정과 무관하게 늘 돈다.
    reclassify: ${WEARON_BACKFILL_RECLASSIFY:false}
  purchase-check:
    # FR-11 살까 말까 판정 규칙. 같은 카테고리 옷 중 코사인 유사도가 이 값 이상인 옷이 있으면 SIMILAR
    similar-threshold: ${WEARON_PURCHASE_SIMILAR_THRESHOLD:0.85}
    # 비슷한 옷이 없을 때 +N이 이 값 이상이면 BUY, 아니면 THINK
    buy-min-plus: ${WEARON_PURCHASE_BUY_MIN_PLUS:5}
    # FR-12 사용자당 하루(한국 날짜) 판정 요청 한도. 넘으면 429
    daily-limit: ${WEARON_PURCHASE_DAILY_LIMIT:30}
    # FR-12 30분 지난 임시 사진을 지우는 스케줄러 간격 (ISO-8601 기간)
    cleanup-delay: PT1M
  revival:
    # FR-29 이 일수 이상 착용 기록이 없는(착용 기록이 없으면 등록일 기준) 분류된 옷을 '오래 안 입은 옷'으로 본다
    unworn-days: ${WEARON_REVIVAL_UNWORN_DAYS:60}
  events:
    # FR-14 1년 지난 이벤트를 지우는 시각 (cron, 한국 시각)
    retention-cron: "0 30 4 * * *"

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

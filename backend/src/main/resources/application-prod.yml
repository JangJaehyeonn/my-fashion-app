# 운영 프로필(SPRING_PROFILES_ACTIVE=prod). 운영 전용 값은 기본값 없이 환경변수로만 받는다.
# 비어 있으면 ProdConfigValidator가 어떤 변수가 빠졌는지 알려 주며 기동을 중단한다.
storage:
  type: ${STORAGE_TYPE:}
app:
  public-base-url: ${PUBLIC_BASE_URL:}
  frontend-url: ${FRONTEND_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  oauth2-redirect-base: ${OAUTH2_REDIRECT_BASE:fashionapp://app}

# 통합 테스트(@ActiveProfiles("test"))용 설정.
# DB/Redis는 로컬 docker compose(postgres, redis)를 그대로 쓰고, 외부 서비스 자격 증명은 전부 더미 값으로 덮어써서
# backend/.env의 실제 키가 테스트에 쓰이지 않게 한다 (S3·AI 서버 빈은 테스트에서 @MockBean으로 대체).
spring:
  datasource:
    # 로컬·CI 테스트용 postgres 컨테이너의 테스트 전용 비밀번호 (실제 비밀값 아님)
    password: fashionapp
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret

jwt:
  # 테스트 전용 HMAC 키 (Base64, 32바이트 이상)
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cw==

storage:
  type: local
  local:
    root: ${java.io.tmpdir}/fashionapp-test-storage

app:
  # 실제 AI 서버로 나가지 않도록 존재하지 않는 포트로 지정 (AiServerClient도 목으로 대체됨)
  ai-server-url: http://127.0.0.1:9

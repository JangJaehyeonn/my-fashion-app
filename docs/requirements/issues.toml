  "가짜 AI 서버 임베딩이 다운이어도 서버는 정상 기동한다",
  "기본 설정에서는 분류 API가 호출되지 않는다 (가짜 AI 서버 호출 기록으로 확인)",
]

[[requirement]]
id = "FR-09"
title = "코디 수 계산 엔진 (+N 코디)"
area = "backend"
priority = "필수"
phase = 2
detail = "LLM 없이 규칙으로 '유효한 코디'를 세는 엔진을 만든다. 코디 = 상의 1 + 하의 1 + 신발 1 (+ 아우터 0~1). 미분류 옷은 제외한다. 유효성 규칙(색 조합, 계절 충돌, 스타일 충돌)은 backend 리소스의 JSON 규칙 파일로 두어 코드 수정 없이 조정할 수 있게 하고, 규칙 형식과 기본값은 ADR로 남긴다. 제공 기능: (1) 내 옷장 전체 유효 코디 수, (2) 옷별 '이 옷이 들어가는 유효 코디 수', (3) 가상의 새 옷(속성만)을 넣었을 때 늘어나는 코디 수(+N)와 새 옷이 들어간 유효 조합 목록. 결과는 옷장이 바뀔 때 다시 계산하고 사용자별로 캐시한다. GET /api/clothes 응답에 옷별 comboCount를, 별도 요약 API에 전체 코디 수를 넣는다. 같은 입력이면 항상 같은 결과다."
depends = ["FR-01"]
acceptance = [
  "상의 2·하의 2·신발 1이고 모두 서로 어울리는 옷장의 전체 코디 수는 4다 (아우터 없음)",
  "아우터 1벌을 추가하면 전체 코디 수는 8이다 (아우터 없이 4 + 아우터 포함 4)",
  "규칙상 충돌하는 조합(규칙 파일의 예시 충돌 색 조합)은 세지 않는다",
  "미분류 옷은 어떤 수에도 포함되지 않는다",
  "옷 목록 응답의 각 옷에 comboCount가 있고, 값은 그 옷이 들어간 유효 코디 수와 같다",
  "옷을 추가·삭제·수정하면 다음 조회에서 수가 바뀐다",
  "같은 옷장으로 두 번 계산한 결과가 같다",
]

[[requirement]]
id = "FR-10"
title = "착용 기록 API"
area = "backend"
priority = "필수"
phase = 2
detail = "POST /api/wears {clothesIds[], date(선택, 기본 오늘)}로 착용을 기록한다(같은 날 같은 옷은 한 번만). 옷 목록 응답에 옷별 wearCount·lastWornAt을 넣고, GET /api/wears/summary로 이번 주·이번 달 착용 횟수와 가장 많이 입은 옷을 준다. 탈퇴 시 기록을 지운다. 남의 옷 ID는 400."
depends = ["FR-01"]
acceptance = [
  "코디의 옷 3벌을 기록하면 각 옷의 wearCount가 1씩 늘고 lastWornAt이 오늘이다",
  "같은 날 같은 옷을 두 번 기록해도 1회로 센다",
  "남의 옷 ID가 섞이면 400이고 아무것도 기록되지 않는다",
  "summary의 이번 주·이번 달 횟수와 가장 많이 입은 옷이 기록과 맞다",
  "탈퇴 후 착용 기록이 0건이다",
]

[[requirement]]
id = "FR-11"
title = "살까 말까 판정 API"
area = "backend"
priority = "필수"
phase = 2
detail = "POST /api/purchase-checks(멀티파트 image, 선택 price). 분류 → 임베딩 → 같은 카테고리 내 옷 중 코사인 유사도 상위 3개(미분류·임베딩 없는 옷 제외) → FR-09 엔진으로 +N과 새 옷이 들어간 유효 조합 계산 → 판정 → 대표 코디 선택과 이유 문장 순서다. 판정은 백엔드 규칙으로만 정한다: 유사도가 기준값(설정 wearon.purchase-check.similar-threshold, 기본 0.85) 이상인 옷이 있으면 SIMILAR, 아니면 +N이 설정값(wearon.purchase-check.buy-min-plus, 기본 5) 이상이면 BUY, 아니면 THINK. 옷장 5벌 미만은 CLOSET_TOO_SMALL(400). 대표 코디는 엔진이 만든 유효 조합 중에서만 AI 서버가 최대 3개를 고르고(목록 밖 조합은 서버에서 버림), 이유 문장은 AI 서버가 판정·+N·비슷한 옷(이름·유사도·착용 횟수·마지막 착용일)·옷장 분포를 받아 headline·reasons 3개·gap·비슷한 옷별 note만 생성한다. 판정을 바꾸거나 구매를 부추기거나 말리는 문장을 쓰지 않는다. 이유 생성이 실패하면 규칙 기반 기본 문장을 쓴다. 응답에 plus, comboCountBefore, comboCountAfter를 넣는다. 예상 착용 횟수(expectedWears)는 같은 카테고리 옷들의 최근 90일 착용 횟수 합 × (plus ÷ 그 카테고리 전체 유효 코디 수)를 1년치로 환산한 값(반올림)이고, 착용 기록이 30일 미만이면 null이다. price가 있고 expectedWears가 1 이상이면 costPerWear = price ÷ expectedWears(원 단위 반올림), 아니면 null. 구간별 처리 시간을 로그로 남긴다."
depends = ["FR-07", "FR-09", "FR-10"]
acceptance = [
  "옷장에 비슷한 옷(유사도 기준값 이상)이 있으면 verdict=SIMILAR, similar에 유사도 내림차순 최대 3개와 각 옷의 착용 횟수가 있다",
  "비슷한 옷이 없고 +N이 5 이상이면 BUY, 4 이하면 THINK다",
  "유사도가 정확히 기준값이면 SIMILAR다",
  "plus는 FR-09 엔진으로 계산한 값과 같고, comboCountAfter - comboCountBefore = plus다",
  "가짜 AI 서버가 판정과 다른 값을 담은 이유 응답을 줘도 verdict는 규칙대로다",

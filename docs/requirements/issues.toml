# Wearon 요구사항 (v3, 2026-11-21) — 핵심 기능: 살까 말까 / 오늘 뭐 입지 / 이 코디 내 옷으로(출시 후)
# 방향: "잘 사게 도와주는 옷장 앱". 대표 숫자는 "+N 코디"(이 옷을 사면 내 옷장 코디가 몇 개 늘어나는지).
# 화면 기준: docs/design/ui-spec.md
#
# scripts/create_issues.py가 이 파일로 GitHub 이슈를 만든다.
# 모든 구현은 Opus로 한다 (model 필드 없음). 리뷰·승인은 ai-review(Sonnet).
# verify = "human"인 요구사항(앱 화면)은 인수 테스트 초안을 만들지 않는다.
#   CI는 빌드·단위 테스트만 보고, 화면은 Phase 끝의 에뮬레이터 확인(사람 관문)에서 본다.
# Phase 1~4가 출시 범위다. Phase 5는 출시 후이며 자동으로 시작하지 않는다 (WEARON_MAX_AUTO_PHASE=4).
# 이 파일은 보호 경로다. 수정은 사람 승인 PR로만 한다.
#
# 인수 테스트 공통 전제 (acceptance/ 하네스)
# - 백엔드 + PostgreSQL(pgvector) + Redis + 가짜 AI 서버(acceptance/fake_ai)를 띄우고 HTTP로만 검증한다.
# - 가짜 AI 서버는 업로드 파일 이름의 접두어(예: top_navy_knit.jpg)로 정해진 분류·임베딩·코디·문장을 돌려주고,
#   /__control로 "다운", "지연", "잘못된 응답"을 켜고, 호출 기록을 조회할 수 있다. 실제 OpenAI는 절대 호출하지 않는다.
# - 테스트 사용자는 아이디·비밀번호 가입 API로 만든다 (OAuth 불필요).

# ───────────── Phase 1: 출시 준비 잔여 ─────────────

[[requirement]]
id = "FR-01"
title = "AI 분류 실패 시 미분류로 저장"
area = "backend"
priority = "필수"
phase = 1
detail = "옷 등록 중 AI 서버가 연결 실패·타임아웃·5xx·잘못된 응답이면 사진은 저장하고 카테고리·색상은 미분류 상태로 등록한다. 응답에 분류 실패 여부를 넣는다. 미분류 옷은 코디 추천·코디 수 계산·유사 검색 대상에서 뺀다. 사용자가 카테고리·색상·이름을 직접 고치는 API와, 미분류 옷을 다시 분류 요청하는 API를 둔다."
depends = []
acceptance = [
  "AI 서버가 다운된 상태에서 옷을 등록하면 201이 오고 응답의 분류 실패 표시가 true, 카테고리는 미분류다",
  "AI 서버가 잘못된 형식을 돌려줘도 같은 결과다",
  "PATCH로 미분류 옷의 카테고리·색상·이름을 고치면 이후 목록 조회에 반영된다",
  "재분류 요청은 AI 서버가 살아 있으면 분류 결과로 갱신되고, 다운이면 503과 안내 문구를 돌려주며 기존 값은 그대로다",
  "미분류 옷만 있는 옷장으로 코디 추천을 요청해도 500이 나지 않고, 추천 결과에 미분류 옷 ID가 들어가지 않는다",
]


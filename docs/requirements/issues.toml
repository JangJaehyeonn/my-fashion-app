# ───────────── Phase 2: 서버 핵심 (코디 수 엔진, 착용 기록, 살까 말까, 지표) ─────────────

[[requirement]]
id = "FR-07"
title = "pgvector와 옷 속성·임베딩"
area = "backend"
priority = "필수"
phase = 2
detail = "PostgreSQL에 pgvector 확장을 켜고(기동 시 CREATE EXTENSION IF NOT EXISTS + 멱등 SQL 스크립트), clothes에 fit·material·pattern·season(nullable)과 embedding vector(1536)를 추가한다. AI 서버 분류 응답에 네 속성을 추가하고(모르면 null), POST /ai/embed(OpenAI text-embedding-3-small)를 둔다. 백엔드는 '카테고리 색상 핏 소재 패턴 이름'(null 제외)으로 임베딩을 만들어 옷 등록·속성 수정·재분류 때 저장한다. 임베딩 실패는 옷 등록 실패로 이어지지 않는다. 로컬 compose와 인수 테스트 하네스는 pgvector 이미지를 쓴다. 벡터 매핑 방식은 ADR로 남긴다."
depends = ["FR-01"]
acceptance = [
  "옷을 등록하면 응답에 fit·material·pattern·season이 오고 DB에 임베딩이 저장된다",
  "가짜 AI 서버의 임베딩을 다운시켜도 옷 등록은 201이고 임베딩만 비어 있다",
  "속성을 PATCH로 고치면 임베딩이 다시 계산된다",
  "기존 옷 목록 조회 응답이 깨지지 않는다 (새 필드만 추가)",
]

[[requirement]]
id = "FR-08"
title = "기존 옷 임베딩 백필"
area = "backend"
priority = "필수"
phase = 2

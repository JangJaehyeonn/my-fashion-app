# ───────────── Phase 5: 출시 후 (자동 시작 안 함) ─────────────

[[requirement]]
id = "FR-31"
title = "이 코디 내 옷으로 (트렌드 재현)"
area = "backend"
priority = "필수"
phase = 5
detail = "앱 공유 기능(다른 앱 → 공유 → Wearon)이나 갤러리로 받은 코디 사진 한 장을 분석한다. SNS를 서버가 수집하지 않고, 원본 사진은 저장하지 않는다. AI 서버 Vision으로 사진 속 옷을 최대 5개 아이템으로 나눠 각각 카테고리·색·핏·소재를 텍스트로 추출하고(사람·얼굴은 설명하지 않음), 아이템마다 임베딩 → 같은 카테고리 내 옷 유사 검색(FR-11과 같은 검색). 규칙: 유사도가 기준값 A(기본 0.85) 이상이면 '나란히', B(기본 0.70) 이상이면 '대체', 미만이면 '없음'. 재현율 = (나란히+대체) ÷ 아이템 수. 고른 내 옷 조합이 FR-09 엔진상 유효한지 확인하고, '없음' 아이템마다 사면 늘어나는 +N과 쇼핑몰 검색어(FR-23에서 남긴 모듈)를 준다. AI는 '비슷하게 입는 법' 한 줄만 쓴다. look_recreations에 결과(사진 없이)를 남기고 이벤트 LOOK_RECREATED를 기록한다. 앱 화면: 원본 사진 + 재현율, 아이템별 '원본 → 내 옷(유사도) / 없음 + 이것만 사면 재현율 100%·코디 +N + 살까 말까로 이어지는 버튼', 재현 코디 카드 + '오늘 이거 입었어요'."
depends = ["FR-11", "FR-09", "FR-23"]
acceptance = [
  "가짜 AI가 아이템 4개를 주고 내 옷장에 3개가 기준값 이상이면 재현율 75%와 아이템별 분류가 온다",
  "'없음' 아이템마다 plus가 FR-09 엔진 값과 같다",
  "원본 사진이 저장소와 DB 어디에도 남지 않는다",
  "가짜 AI가 아이템을 0개 주면 400과 '옷을 찾지 못했어요' 안내",
]

[[requirement]]
id = "FR-25"
title = "다음에 살 옷 추천"
area = "backend"
priority = "권장"
phase = 5
detail = "옷장 빈틈을 분석해 '이 1벌을 사면 코디가 가장 많이 늘어나는' 후보를 3개 제안한다. 후보 속성은 정해진 후보 목록(카테고리×색상×핏 조합, 리소스 파일)에서 FR-09 엔진으로 +N을 계산해 상위 3개를 고르고, 이유 한 줄과 쇼핑몰 검색어는 AI 서버가 쓴다. 쇼핑 홈에 카드로 보여준다 (ui-spec 쇼핑 홈 '다음에 살 옷 추천')."
